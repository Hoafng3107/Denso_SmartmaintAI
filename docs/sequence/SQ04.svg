<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="middle"><tspan x="262.5" y="2483.35">SQ04.19 Hiện thông tin theo dõi</tspan><tspan x="262.5" y="2502.85">và liên kết tới đề xuất</tspan></text>
<rect x="45" y="2537" width="1325" height="48" rx="0" fill="#fffbe8" stroke="#d4c77b"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="57" y="2566.1">Không tự chọn tác giả làm người duyệt khi thiếu người phù hợp. Gửi lại cùng mã lần gửi chỉ trả kết quả đã có, không tạo hai đề xuất.</tspan></text>
<rect x="45" y="2605" width="1325" height="66" rx="0" fill="#edf5f0" stroke="#719485"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="57" y="2643.1">ref SQ05 · Người duyệt mở hồ sơ và quyết định</tspan></text>
<rect x="1425" y="432" width="540" height="176" rx="7" fill="#f7f9fc" stroke="#cbd5e1"/>
<text font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364b" text-anchor="start"><tspan x="1440" y="463.78">UI-08 · Xác nhận gửi đề xuất</tspan></text>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="1440" y="495.35">Hiện tiêu đề, loại đề xuất, máy/phạm vi, tác giả/người đóng góp,</tspan><tspan x="1440" y="514.85">kết quả đối chiếu, nguồn hoặc báo cáo ca.</tspan><tspan x="1440" y="534.35">Cập nhật: hiện ID và phiên bản gốc. Liên kết case: hiện ca và tri</tspan><tspan x="1440" y="553.85">thức đích.</tspan><tspan x="1440" y="573.35">Xác nhận “Tôi đã kiểm tra nội dung và phạm vi áp dụng”.</tspan><tspan x="1440" y="592.85">Nút “Gửi kiểm duyệt”; khi gửi hiện tiến trình và khóa gửi lặp.</tspan></text>
<rect x="1425" y="2129" width="540" height="196" rx="7" fill="#f7f9fc" stroke="#cbd5e1"/>
<text font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364b" text-anchor="start"><tspan x="1440" y="2160.78">UI-09 · Đề xuất của tôi</tspan></text>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="1440" y="2192.6">Mỗi dòng: mã, tiêu đề, nguồn Chuyên gia/Case, loại Mới/Cập</tspan><tspan x="1440" y="2212.1">nhật/Liên kết, trạng thái, người duyệt, lần cập nhật.</tspan><tspan x="1440" y="2231.6">Chi tiết có timeline: nháp → gửi → phản hồi → gửi lại → quyết</tspan><tspan x="1440" y="2251.1">định.</tspan><tspan x="1440" y="2270.6">Chờ duyệt: xem bản đã gửi, chưa sửa trực tiếp ảnh chụp đó.</tspan><tspan x="1440" y="2290.1">Chưa có người duyệt phù hợp: “Đã gửi — chờ phân công người</tspan><tspan x="1440" y="2309.6">duyệt”; giữ trong hàng đợi đúng chuyên môn.</tspan></text>
<text font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="28" y="2807.08">Nguồn: denso-maintenance-workflows-BPMN.drawio  |  BPMN: k-submit, k-queue, r-submit  |  Xem 00 · Bản đồ để chọn tình huống.</tspan></text></svg>