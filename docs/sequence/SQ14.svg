<path d="M690 2277L975 2277" stroke="#526579" stroke-width="1.4" fill="none" marker-end="url(#block)"/>
<rect x="702" y="2230" width="261" height="38" rx="0" fill="#ffffff" stroke="none"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="middle"><tspan x="832.5" y="2244.35">SQ14.18 Giữ dữ kiện trong ca để</tspan><tspan x="832.5" y="2263.85">đưa vào báo cáo/đề xuất</tspan></text>
<path d="M690 2345L405 2345" stroke="#526579" stroke-width="1.4" fill="none" stroke-dasharray="6 5" marker-end="url(#open)"/>
<rect x="417" y="2298" width="261" height="38" rx="0" fill="#ffffff" stroke="none"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="middle"><tspan x="547.5" y="2312.35">SQ14.19 Đã ghi; có thể đề xuất</tspan><tspan x="547.5" y="2331.85">cập nhật sau khi xác minh</tspan></text>
<rect x="45" y="2402" width="1325" height="48" rx="0" fill="#fffbe8" stroke="#d4c77b"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="57" y="2431.1">Đọc nguồn là thao tác hỗ trợ, không phê duyệt thêm lần nữa. Phản hồi được giữ trong ca và chỉ trở thành tri thức xuất bản khi đi qua SQ13 → SQ04 → SQ05.</tspan></text>
<rect x="1425" y="432" width="540" height="276" rx="7" fill="#f7f9fc" stroke="#cbd5e1"/>
<text font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364b" text-anchor="start"><tspan x="1440" y="463.78">UI-28 · Chi tiết tri thức / case đã duyệt</tspan></text>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="1440" y="496.6">Hiện tên, loại nội dung, máy/phạm vi, tác giả/người đóng góp,</tspan><tspan x="1440" y="516.1">người duyệt, ngày và phiên bản.</tspan><tspan x="1440" y="535.6">Nội dung: triệu chứng/bối cảnh, nguyên nhân và bằng chứng, kiểm</tspan><tspan x="1440" y="555.1">tra, hướng xử lý, kết quả, điều kiện, giới hạn, an toàn và bài</tspan><tspan x="1440" y="574.6">học.</tspan><tspan x="1440" y="594.1">Có liên kết nguồn/báo cáo theo quyền; dữ liệu nhạy cảm không được</tspan><tspan x="1440" y="613.6">mở chỉ vì biết ID.</tspan><tspan x="1440" y="633.1">Nguồn đang được xem giữ đúng phiên bản đã trích dẫn; nếu có bản</tspan><tspan x="1440" y="652.6">mới thì gắn nhãn và cho đối chiếu.</tspan><tspan x="1440" y="672.1">Nút “Quay lại kết quả”, “Xem phiên bản hiện hành”, “Ghi nhận tham</tspan><tspan x="1440" y="691.6">khảo” khi đang có ca.</tspan></text>
<rect x="1425" y="1570" width="540" height="216" rx="7" fill="#f7f9fc" stroke="#cbd5e1"/>
<text font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364b" text-anchor="start"><tspan x="1440" y="1601.78">UI-29 · Tham khảo / áp dụng trong ca</tspan></text>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="1440" y="1633.85">Phân biệt: “Đã đọc” / “Chọn làm hướng tham khảo” / “Đã thực hiện”</tspan><tspan x="1440" y="1653.35">/ “Kết quả sau áp dụng”.</tspan><tspan x="1440" y="1672.85">Phản hồi: phù hợp, áp dụng một phần, không áp dụng được; ghi điểm</tspan><tspan x="1440" y="1692.35">khác và lý do.</tspan><tspan x="1440" y="1711.85">Chọn nguồn không tự đánh dấu sửa xong; kết quả thực tế lấy từ</tspan><tspan x="1440" y="1731.35">nhật ký/báo cáo.</tspan><tspan x="1440" y="1750.85">Ngoài ca đang làm: chỉ tra cứu; không tạo case sửa chữa giả chỉ</tspan><tspan x="1440" y="1770.35">để lưu một lần đọc.</tspan></text>
<text font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="28" y="2586.08">Nguồn: denso-maintenance-workflows-BPMN.drawio  |  BPMN: k-read, r-assess  |  Xem 00 · Bản đồ để chọn tình huống.</tspan></text></svg>