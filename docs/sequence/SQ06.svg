<text font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="28" y="148.44">Kết quả: Có revision được người gửi xác nhận, đã đối chiếu lại và gửi duyệt; giữ mọi vòng phản hồi.</tspan></text>
