<rect x="45" y="2160" width="1325" height="66" rx="0" fill="#edf5f0" stroke="#719485"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="57" y="2198.1">ref SQ03 · Đối chiếu lại và xác nhận tạo mới/cập nhật hoặc hủy nếu trùng</tspan></text>
<rect x="45" y="2317" width="1325" height="66" rx="0" fill="#edf5f0" stroke="#719485"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="57" y="2355.1">ref SQ13 · Chỉ đối chiếu và sửa đề xuất tri thức; giữ báo cáo ca đã hoàn tất</tspan></text>
<rect x="45" y="2496" width="1325" height="66" rx="0" fill="#edf5f0" stroke="#719485"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="57" y="2534.1">ref SQ04 · Gửi revision mới, giữ proposalId và số vòng bổ sung</tspan></text>
<rect x="45" y="2654" width="1325" height="48" rx="0" fill="#fffbe8" stroke="#d4c77b"/>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="57" y="2683.1">Nếu phát hiện dữ kiện thực tế của báo cáo sai: tạo bản đính chính có lý do và người xác nhận theo SQ12; không âm thầm ghi nội dung đề xuất ngược vào báo cáo.</tspan></text>
<rect x="1425" y="432" width="540" height="176" rx="7" fill="#f7f9fc" stroke="#cbd5e1"/>
<text font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364b" text-anchor="start"><tspan x="1440" y="463.78">UI-12 · Chi tiết yêu cầu bổ sung</tspan></text>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="1440" y="495.35">Hiện người nhận xét, ngày giờ, lần xét duyệt, từng mục cần sửa và</tspan><tspan x="1440" y="514.85">lý do.</tspan><tspan x="1440" y="534.35">Bên cạnh có bản đã gửi, bản đang sửa và phần người duyệt đề nghị</tspan><tspan x="1440" y="553.85">thay đổi.</tspan><tspan x="1440" y="573.35">Nút “Sửa đề xuất”, “Xem nguồn”, “Lưu và thoát”.</tspan><tspan x="1440" y="592.85">Báo cáo ca gốc vẫn chỉ đọc; không thay đổi theo nội dung đề xuất.</tspan></text>
<rect x="1425" y="1703" width="540" height="196" rx="7" fill="#f7f9fc" stroke="#cbd5e1"/>
<text font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364b" text-anchor="start"><tspan x="1440" y="1734.78">UI-13 · Gửi lại sau bổ sung</tspan></text>
<text font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="1440" y="1766.6">Hiện danh sách nhận xét đã xử lý/chưa xử lý và so sánh với lần</tspan><tspan x="1440" y="1786.1">gửi trước.</tspan><tspan x="1440" y="1805.6">Nút “Đối chiếu lại”, sau đó “Gửi lại kiểm duyệt”.</tspan><tspan x="1440" y="1825.1">Thông báo khi thiếu: “Còn mục cần bổ sung hoặc chưa có giải</tspan><tspan x="1440" y="1844.6">thích”.</tspan><tspan x="1440" y="1864.1">Tác giả phải xác nhận nội dung chuyên môn do người duyệt đề nghị;</tspan><tspan x="1440" y="1883.6">không tự xuất bản sau khi nhận sửa.</tspan></text>
<text font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#24364b" text-anchor="start"><tspan x="28" y="2838.08">Nguồn: denso-maintenance-workflows-BPMN.drawio  |  BPMN: k-return, k-revise, r-revise  |  Xem 00 · Bản đồ để chọn tình huống.</tspan></text></svg>