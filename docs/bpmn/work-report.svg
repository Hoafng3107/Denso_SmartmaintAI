<svg xmlns="http://www.w3.org/2000/svg" width="6090" height="1550" viewBox="0 0 6090 1550" role="img" aria-label="05 · AI tổng kết, xác nhận đóng góp và lưu báo cáo"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172b43" text-anchor="start">
<tspan x="20" y="49.52">05 · AI tổng kết, xác nhận đóng góp và lưu báo cáo</tspan>
</text>
<text font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#172b43" text-anchor="start">
<tspan x="20" y="90.44">Chi tiết r-report · Một reportId; revision theo lần cập nhật · Hồ sơ và máy không đổi trạng thái vì AI lỗi hoặc báo cáo chờ xác nhận</tspan>
</text>
<text font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172b43" text-anchor="start">
<tspan x="20" y="132.76">○ Bắt đầu ◉ Kết thúc ▢ Tác vụ ◇ X: chọn một nhánh → Luồng thực hiện</tspan>
</text>
<rect x="20" y="150" width="6050" height="30" rx="0" fill="#16324f" stroke="#16324f" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">
<tspan x="32" y="170.44">DENSO · QUẢN LÝ TRI THỨC BẢO TRÌ</tspan>
</text>
<rect x="20" y="180" width="6050" height="450" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="180" width="180" height="450" rx="0" fill="#edf5ff" stroke="#cbd5e1" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2c6096" text-anchor="middle">
<tspan x="110" y="244.42000000000002">NGƯỜI</tspan>
<tspan x="110" y="267.82">BẢO TRÌ</tspan>
</text>
<text font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">
<tspan x="110" y="360.97">Phụ trách hồ sơ</tspan>
<tspan x="110" y="377.87">Hỗ trợ và ghi nhanh</tspan>
</text>
<rect x="20" y="630" width="6050" height="340" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="630" width="180" height="340" rx="0" fill="#eaf7f5" stroke="#cbd5e1" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#267567" text-anchor="middle">
<tspan x="110" y="706.12">CHUYÊN GIA</tspan>
</text>
<text font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">
<tspan x="110" y="810.9699999999999">Điều tra / xử lý</tspan>
<tspan x="110" y="827.8699999999999">Xác nhận đóng góp</tspan>
</text>
<rect x="20" y="970" width="6050" height="450" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="970" width="180" height="450" rx="0" fill="#f2effb" stroke="#cbd5e1" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7258a2" text-anchor="middle">
<tspan x="110" y="1034.4199999999998">HỆ THỐNG</tspan>
<tspan x="110" y="1057.82">&amp; AI</tspan>
</text>
<text font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">
<tspan x="110" y="1150.97">Lưu liên tục</tspan>
<tspan x="110" y="1167.8700000000001">Hỗ trợ có căn cứ</tspan>
</text>
<rect x="340" y="220" width="880" height="240" rx="2" fill="#fffde9" stroke="#d4c77b" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172b43" text-anchor="start">
<tspan x="352" y="308.36">Báo cáo gồm: bối cảnh, điều kiện/model sản phẩm/5M1E; giả thuyết và căn cứ; mọi bước đã thử và kết quả.</tspan>
<tspan x="352" y="326.56">Nguyên nhân: Đã xác nhận / Còn giả thuyết / Chưa xác định. Máy phục hồi không tự xác nhận nguyên nhân.</tspan>
<tspan x="352" y="344.76">Việc tương lai được ghi thành việc theo dõi. Kết thúc chưa khắc phục cần lý do và quyết định phù hợp.</tspan>
<tspan x="352" y="362.96000000000004">Người bảo trì xác nhận tổng hợp; chuyên gia xác nhận phần mình. Tái dùng xác nhận cuối đợt nếu nội dung không đổi.</tspan>
<tspan x="352" y="381.16">Xem nháp giữ reportId, đổi reportRevision; có dữ kiện mới thì nháp cần cập nhật. Không ghi đè bản đã chốt.</tspan>
</text>
<rect x="4450" y="680" width="1450" height="240" rx="2" fill="#fffde9" stroke="#d4c77b" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172b43" text-anchor="start">
<tspan x="4462" y="768.36">Nếu chuyên gia yêu cầu sửa: chỉ cập nhật/xác nhận lại phần bị ảnh hưởng. Chưa phản hồi: lưu chờ và kết thúc phiên, không phải đợi tại màn hình.</tspan>
<tspan x="4462" y="786.5600000000001">Ba trạng thái riêng: machineState (thực tế), workState (đang làm/chờ/kết thúc), reportState (nháp/chờ/đã xác nhận).</tspan>
<tspan x="4462" y="804.76">Đồng bộ HozenDX theo API và quyền thực tế; lỗi đồng bộ không đảo ngược báo cáo đã lưu. Hiện nguồn và thời điểm.</tspan>
<tspan x="4462" y="822.96">Sau chốt, đính chính phải có lý do, trước/sau và xác nhận phần bị ảnh hưởng; tác động tri thức thì gửi đề xuất cập nhật.</tspan>
<tspan x="4462" y="841.16">Bài học mới vẫn qua chuyên gia trưởng. Lưu lịch sử công việc không chờ duyệt tri thức.</tspan>
</text>
