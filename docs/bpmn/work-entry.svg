<tspan x="110" y="664.42">HỆ THỐNG</tspan>
<tspan x="110" y="687.8199999999999">&amp; AI</tspan>
</text>
<text font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">
<tspan x="110" y="780.9699999999999">Lưu liên tục</tspan>
<tspan x="110" y="797.8699999999999">Hỗ trợ có căn cứ</tspan>
</text>
<rect x="20" y="1000" width="4880" height="300" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="1000" width="180" height="300" rx="0" fill="#eaf2f4" stroke="#cbd5e1" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#467580" text-anchor="middle">
<tspan x="110" y="1064.4199999999998">HOZENDX</tspan>
<tspan x="110" y="1087.82">TÍCH HỢP</tspan>
</text>
<text font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">
<tspan x="110" y="1172.52">Dữ liệu có quyền</tspan>
<tspan x="110" y="1189.42">truy cập; API và lịch</tspan>
<tspan x="110" y="1206.32">PM tùy khả năng</tspan>
</text>
<rect x="1550" y="1065" width="3070" height="155" rx="2" fill="#fffde9" stroke="#d4c77b" stroke-width="1"/>
<text font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172b43" text-anchor="start">
<tspan x="1562" y="1110.86">Q&amp;A xác nhận HozenDX/AIHO có lý lịch máy (maker/model/năm/thông số), cấu trúc/linh kiện, chế độ bảo dưỡng, BM, nội dung sửa chữa, kết quả PM, SOP/DAS, bản vẽ, hồ sơ cải tạo và tồn kho.</tspan>
<tspan x="1562" y="1129.06">Q&amp;A chưa xác nhận API, lịch/phân công PM hay trạng thái máy tức thời. Prototype mô phỏng có ghi nguồn; chỉ điền phần tích hợp thực sự cung cấp.</tspan>
<tspan x="1562" y="1147.26">Không tìm thấy máy / không có quyền / chưa xác minh dữ liệu: chưa cho bắt đầu. Bản lưu cũ được gắn thời điểm và người dùng xác nhận, không giả vờ đồng bộ thành công.</tspan>
<tspan x="1562" y="1165.4599999999998">Nếu có hồ sơ đang mở: ưu tiên tiếp tục/tham gia; công việc khác phải có lý do, không gộp sự cố độc lập. PM phát hiện bất thường giữ liên kết hạng mục và hồ sơ gốc.</tspan>
<tspan x="1562" y="1183.6599999999999">Dữ liệu tích hợp và dữ kiện hiện trường có nguồn riêng; khác nhau được hiển thị để xác minh, không âm thầm ghi đè.</tspan>
</text>
